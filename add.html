<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Add Subscription | Subscription Tracker</title>

  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/kristi005-s/subscription-tracker@v1.0.0/css/ui-library.css">
</head>
<body>
  <header class="ui-header">
    <h1>Subscription Tracker</h1>
    <nav class="ui-nav">
      <a href="add.html" class="ui-nav-link is-active">Add</a>
      <a href="index.html" class="ui-nav-link">Subscriptions</a>
      <a href="summary.html" class="ui-nav-link">Summary</a>
    </nav>
  </header>

  <main class="ui-container">

    <section id="form-section" class="ui-card">
      <h2>Add Subscription</h2>
      <form id="subscription-form">
        <div class="ui-form-group">
          <label for="service">Service</label>
          <input type="text" id="service" name="service" required>
        </div>

        <div class="ui-form-group">
          <label for="provider">Provider</label>
          <input type="text" id="provider" name="provider" required>
        </div>

        <div class="ui-form-group">
          <label for="subscriber">Subscriber</label>
          <input type="text" id="subscriber" name="subscriber" required>
        </div>

        <div class="ui-form-group">
          <label for="renewal-date">Renewal date</label>
          <input type="date" id="renewal-date" name="renewalDate" required>
        </div>

        <div class="ui-form-group">
          <label for="category">Category</label>
          <select id="category" name="category" required>
            <option value="">Select a category</option>
            <option value="Entertainment">Entertainment</option>
            <option value="Software">Software</option>
            <option value="Utilities">Utilities</option>
            <option value="Education">Education</option>
            <option value="Other">Other</option>
          </select>
        </div>

        <button type="submit" class="ui-btn ui-btn-primary">Add subscription</button>
      </form>
    </section>

  </main>

  <script src="https://cdn.jsdelivr.net/gh/kristi005-s/subscription-tracker@v1.0.0/js/subscription-lib.js"></script>
  <script>
    // The library sets this hash after a successful add; go to the table page
    window.addEventListener("hashchange", function () {
      if (window.location.hash === "#table-section") {
        window.location.href = "index.html";
      }
    });
  </script>
</body>
</html>
