<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Subscription Tracker</title>

  <!-- The only stylesheet: our own CSS library, served from a CDN -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/kristi005-s/subscription-tracker@v1.0.0/css/ui-library.css">
</head>
<body>
  <header class="ui-header">
    <h1>Subscription Tracker</h1>
    <nav class="ui-nav">
      <a href="#form-section" class="ui-nav-link">Add</a>
      <a href="#summary-section" class="ui-nav-link">Summary</a>
      <a href="#table-section" class="ui-nav-link">Subscriptions</a>
    </nav>
  </header>

  <main class="ui-container">

    <!-- Section 1: Form -->
    <section id="form-section" class="ui-card ui-section">
      <h2>Add Subscription</h2>
      <form id="subscription-form">
        <div class="ui-form-group">
          <label for="service">Service</label>
          <input type="text" id="service" name="service" required>
        </div>

        <div class="ui-form-group">
          <label for="provider">Provider</label>
          <input type="text" id="provider" name="provider" required>
        </div>

        <div class="ui-form-group">
          <label for="subscriber">Subscriber</label>
          <input type="text" id="subscriber" name="subscriber" required>
        </div>

        <div class="ui-form-group">
          <label for="renewal-date">Renewal date</label>
          <input type="date" id="renewal-date" name="renewalDate" required>
        </div>

        <div class="ui-form-group">
          <label for="category">Category</label>
          <select id="category" name="category" required>
            <option value="">Select a category</option>
            <option value="Entertainment">Entertainment</option>
            <option value="Software">Software</option>
            <option value="Utilities">Utilities</option>
            <option value="Education">Education</option>
            <option value="Other">Other</option>
          </select>
        </div>

        <button type="submit" class="ui-btn ui-btn-primary">Add subscription</button>
      </form>
    </section>

    <!-- Section 2: Summary -->
    <section id="summary-section" class="ui-card ui-section">
      <h2>Summary</h2>
      <div class="ui-summary">
        <p>Total subscriptions: <strong id="total-count">0</strong></p>
        <p>Expired subscriptions: <strong id="expired-count">0</strong></p>
      </div>
    </section>

    <!-- Section 3: Table -->
    <section id="table-section" class="ui-card ui-section">
      <h2>Subscriptions</h2>
      <div class="ui-table-wrap">
        <table id="subscription-table" class="ui-table">
          <thead>
            <tr>
              <th>Service</th>
              <th>Provider</th>
              <th>Subscriber</th>
              <th>Renewal date</th>
              <th>Category</th>
              <th>Status</th>
              <th>Action</th>
            </tr>
          </thead>
          <tbody id="subscription-body">
            <!-- Rows will be added by JavaScript -->
          </tbody>
        </table>
      </div>
    </section>

  </main>

  <!-- The only script: our own JavaScript library, served from a CDN -->
  <script src="https://cdn.jsdelivr.net/gh/kristi005-s/subscription-tracker@v1.0.0/js/subscription-lib.js"></script>
</body>
</html>
