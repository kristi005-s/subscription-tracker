<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Subscriptions | Subscription Tracker</title>

  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/kristi005-s/subscription-tracker@v1.0.0/css/ui-library.css">
</head>
<body>
  <header class="ui-header">
    <h1>Subscription Tracker</h1>
    <nav class="ui-nav">
      <a href="add.html" class="ui-nav-link">Add</a>
      <a href="index.html" class="ui-nav-link is-active">Subscriptions</a>
      <a href="summary.html" class="ui-nav-link">Summary</a>
    </nav>
  </header>

  <main class="ui-container">

    <section id="table-section" class="ui-card">
      <h2>Subscriptions</h2>

      <div class="ui-summary">
        <p>Total: <strong id="total-count">0</strong></p>
        <p>Expired: <strong id="expired-count">0</strong></p>
      </div>

      <div class="ui-table-wrap">
        <table id="subscription-table" class="ui-table">
          <thead>
            <tr>
              <th>Service</th>
              <th>Provider</th>
              <th>Subscriber</th>
              <th>Renewal date</th>
              <th>Category</th>
              <th>Status</th>
              <th>Action</th>
            </tr>
          </thead>
          <tbody id="subscription-body">
            <!-- Rows will be added by JavaScript -->
          </tbody>
        </table>
      </div>
    </section>

  </main>

  <script src="https://cdn.jsdelivr.net/gh/kristi005-s/subscription-tracker@v1.0.0/js/subscription-lib.js"></script>
  <script>SubscriptionLib.render();</script>
</body>
</html>
