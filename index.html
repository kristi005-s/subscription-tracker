<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Subscription Tracker</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="header">
    <h1>Subscription Tracker</h1>
  </header>

  <main class="container">

    <!-- Section 1: Form -->
    <section id="form-section" class="card">
      <h2>Add Subscription</h2>
      <form id="subscription-form">
        <div class="form-group">
          <label for="service">Service</label>
          <input type="text" id="service" name="service" required>
        </div>

        <div class="form-group">
          <label for="provider">Provider</label>
          <input type="text" id="provider" name="provider" required>
        </div>

        <div class="form-group">
          <label for="subscriber">Subscriber</label>
          <input type="text" id="subscriber" name="subscriber" required>
        </div>

        <div class="form-group">
          <label for="renewal-date">Renewal date</label>
          <input type="date" id="renewal-date" name="renewalDate" required>
        </div>

        <div class="form-group">
          <label for="category">Category</label>
          <select id="category" name="category" required>
            <option value="">Select a category</option>
            <option value="Entertainment">Entertainment</option>
            <option value="Software">Software</option>
            <option value="Utilities">Utilities</option>
            <option value="Education">Education</option>
            <option value="Other">Other</option>
          </select>
        </div>

        <button type="submit" class="btn btn-primary">Add subscription</button>
      </form>
    </section>

    <!-- Section 2: Summary -->
    <section id="summary-section" class="card">
      <h2>Summary</h2>
      <div class="summary">
        <p>Total subscriptions: <strong id="total-count">0</strong></p>
        <p>Expired subscriptions: <strong id="expired-count">0</strong></p>
      </div>
    </section>

    <!-- Section 3: Table -->
    <section id="table-section" class="card">
      <h2>Subscriptions</h2>
      <table id="subscription-table" class="table">
        <thead>
          <tr>
            <th>Service</th>
            <th>Provider</th>
            <th>Subscriber</th>
            <th>Renewal date</th>
            <th>Category</th>
            <th>Status</th>
            <th>Action</th>
          </tr>
        </thead>
        <tbody id="subscription-body">
          <!-- Rows will be added by JavaScript -->
        </tbody>
      </table>
    </section>

  </main>

  <script src="app.js"></script>
</body>
</html>
